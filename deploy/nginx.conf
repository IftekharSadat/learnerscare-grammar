server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # security headers (the app has no inline scripts; styles are bundled; media and data are same-origin)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
  # add your LLM proxy origin to connect-src if you enable it
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

  # the service worker and the app shell must always be revalidated
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { application/manifest+json webmanifest; } }
  # hashed build assets never change
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  # unit content: audio needs range requests (nginx serves them by default)
  location /content/ { add_header Cache-Control "public, max-age=3600"; }

  location / { try_files $uri $uri/ /index.html; }
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
